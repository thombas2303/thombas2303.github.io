<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/styles/primary.css" />
    <title>Thomas Allen</title>
  </head>
  <body>

    <div id="layout"></div>

    <template id="title">
      <h2>leimont.co.uk</h2>
    </template>

    <template id="content">
      <p>
        Welcome to <a class="link" href="https://www.leimont.co.uk">leimont.co.uk</a>.
      </p>
      <hr>
      <p>
        This is a website owned by <strong>Thomas Allen</strong>, a third year studying <strong>Computer Science (MEng)</strong>
        at the <a class="link" href="https://www.southampton.ac.uk/">University of Southampton</a>.
        <br><br>
        My current interests are well represented by my module choices; currently being Machine Learning,
        Cloud Development, and Computing History.
        <br><br>
        Outside of my academics I'm an olympic recurve archer (thats the style, not an indication of my skill level),
        I collect various playing cards, and I read classical literature.
      </p>
      <hr>

      <section id="recent-songs" class="recent-songs-section active">
        <div class="section-content">
          <h3>Recently Listened To</h3>
          <ul id="song-list" class="song-list"></ul>
          <h3>Top Artists</h3>
          <div id="artist-row" class="artist-row"></div>
        </div>
      </section>
    
      <hr>

      <h3>Recently Played Games</h3>
      <br>

      <div id="games-container" class="games-row"><p>Loading games...</p></div>
      <br>

      <hr>

      <p>Contact</p>
    </template>

    <script>
      fetch('/layout.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('layout').innerHTML = html;
          
          const pageContent = document.getElementById('content').content;
          document.getElementById('page-content').appendChild(pageContent.cloneNode(true));
          
          const pageTitle = document.getElementById('title').content;
          document.getElementById('page-title').appendChild(pageTitle.cloneNode(true));

          // Run scripts synchronously after DOM node insertion
          const steamScript = document.createElement('script');
          steamScript.src = '/js/steam-integration.js';
          document.body.appendChild(steamScript);

          const musicScript = document.createElement('script');
          musicScript.src = '/js/stats-fm.js'; // Ensure path matches your filename
          document.body.appendChild(musicScript);
        });
    </script>
  </body>
</html>
